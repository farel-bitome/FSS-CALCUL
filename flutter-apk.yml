name: FSS-CALCUL - Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compiler FSS-CALCUL
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Si un fichier .zip du projet est déposé à la racine du dépôt,
      # son contenu remplace les fichiers du projet (avec les bons dossiers),
      # puis le dépôt est nettoyé et enregistré automatiquement.
      - name: Appliquer la mise à jour (zip)
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "Application de $z"
              unzip -o -q "$z" -x '.github/*' -d .
              rm -f "$z"
            done
            # fichiers envoyés par erreur à la racine
            rm -f build.gradle settings.gradle gradle.properties main.dart flutter-apk.yml .gitignore
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Mise à jour du projet depuis le zip" || true
            git push || true
          fi
          echo "Version AGP utilisée :"; grep 'com.android.application' android/settings.gradle

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Vérifier Flutter
        run: flutter --version

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FSS-CALCUL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
